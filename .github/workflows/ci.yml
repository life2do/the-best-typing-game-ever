name: CI

# Pull requests are tested on their own commits; pushes to main test the merged result and deploy.
# (No push trigger for feature branches: with a PR open it would run the same commit twice.)
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels its outdated run. Runs on main are never cancelled, so every
# merged commit is tested and deployed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide what to run from the files the change touches (tools/affected.mjs, D64). Pull requests run
  # only what their changes can affect; pushes to main run everything before deploying.
  plan:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      lintFiles: ${{ steps.plan.outputs.lintFiles }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      validate: ${{ steps.plan.outputs.validate }}
      unit: ${{ steps.plan.outputs.unit }}
      templates: ${{ steps.plan.outputs.templates }}
      e2e: ${{ steps.plan.outputs.e2e }}
      audit: ${{ steps.plan.outputs.audit }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/affected.mjs --base "${{ github.event.pull_request.base.sha }}"
          else
            node tools/affected.mjs --all
          fi

  # Static checks, engine unit tests and the production build (made once, reused by e2e and deploy).
  check:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint (all)
        if: needs.plan.outputs.lint == 'all'
        run: npm run lint
      - name: Lint (changed files)
        if: needs.plan.outputs.lint == 'changed'
        # File names come from the change itself: pass them as data (env + argv), never through the shell.
        env: { LINT_FILES: '${{ needs.plan.outputs.lintFiles }}' }
        run: node -e "const r=require('child_process').spawnSync('npx',['eslint','--',...JSON.parse(process.env.LINT_FILES)],{stdio:'inherit'});process.exit(r.status??1)"
      - name: Typecheck
        if: needs.plan.outputs.typecheck == 'true'
        run: npm run typecheck
      - name: Validate content
        if: needs.plan.outputs.validate == 'true'
        run: npm run validate
      - name: Engine unit and simulation tests
        if: needs.plan.outputs.unit == 'true'
        run: npx vitest run tests src
      - name: Dependency audit
        if: needs.plan.outputs.audit == 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        if: needs.plan.outputs.build == 'true'
        run: |
          npx vite-node tools/build-content.ts --print > build-id.txt
          npm run build
      - if: needs.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            dist
            build-id.txt
          retention-days: 7

  # One job per game (level template): its own simulation tests (pass bot at tiers 1/4/7, struggle,
  # masher, determinism) and its browser smoke test in every view it supports.
  template:
    name: template (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.templates != '[]' && needs.plan.outputs.templates != ''
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.plan.outputs.templates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Simulation tests
        env: { TEMPLATE: '${{ matrix.template }}' }
        run: npx vitest run "content/templates/$TEMPLATE"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser smoke test
        run: npx playwright test e2e/templates.spec.ts --project=chromium --trace off
        env: { CI: '1', TEMPLATES: '${{ matrix.template }}' }

  # Full end-to-end suite, one job per browser in parallel (per-game smoke tests run in `template`).
  e2e:
    runs-on: ubuntu-latest
    needs: [plan, check]
    if: needs.plan.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} system dependencies (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npm run e2e -- --project=${{ matrix.browser }} --trace off --grep-invert @template
        env: { CI: '1' }

  # Append-only deploy to the gh-pages branch (docs/08 Hosting constraints): every build lives forever
  # under /v/<buildId>/ so old runs can be replayed on the engine that recorded them.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, template, e2e]
    permissions:
      contents: write
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # The exact build that was tested in this run.
      - uses: actions/download-artifact@v8
        with: { name: site }
      - name: Append to gh-pages
        run: |
          BUILD_ID=$(cat build-id.txt)
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq . && git clean -fdq)
          fi
          node tools/publish-pages.mjs dist pages "$BUILD_ID" "$GITHUB_SHA"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy build $BUILD_ID ($GITHUB_SHA)" || exit 0
          git push origin gh-pages
