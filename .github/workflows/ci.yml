name: CI

# Pull requests are tested on their own commits; pushes to main test the merged result and deploy.
# (No push trigger for feature branches: with a PR open it would run the same commit twice.)
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels its outdated run. Runs on main are never cancelled, so every
# merged commit is tested and deployed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      # The production build is made once here and reused by the deploy job.
      - name: Build
        run: |
          npx vite-node tools/build-content.ts --print > build-id.txt
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            dist
            build-id.txt
          retention-days: 7

  # One job per browser, in parallel. Browsers are cached between runs.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} system dependencies (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npm run e2e -- --project=${{ matrix.browser }} --trace off
        env: { CI: '1' }

  # Append-only deploy to the gh-pages branch (docs/08 Hosting constraints): every build lives forever
  # under /v/<buildId>/ so old runs can be replayed on the engine that recorded them.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: write
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # The exact build that was tested in this run.
      - uses: actions/download-artifact@v8
        with: { name: site }
      - name: Append to gh-pages
        run: |
          BUILD_ID=$(cat build-id.txt)
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq . && git clean -fdq)
          fi
          node tools/publish-pages.mjs dist pages "$BUILD_ID" "$GITHUB_SHA"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy build $BUILD_ID ($GITHUB_SHA)" || exit 0
          git push origin gh-pages
